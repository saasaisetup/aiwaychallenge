<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!-- Deep Obsidian Background with Subtle Gradient -->
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#141414"/>
      <stop offset="100%" stop-color="#050505"/>
    </radialGradient>
    <linearGradient id="cyberBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#faff69" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#faff69" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#faff69" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="neonYellow" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#faff69"/>
      <stop offset="100%" stop-color="#e2ea00"/>
    </linearGradient>
    <linearGradient id="accentGlow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#faff69"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <filter id="neonBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Container Box with Rounded Squircle & Hairline Neon Border -->
  <rect width="512" height="512" rx="120" fill="url(#bgGlow)"/>
  <rect x="8" y="8" width="496" height="496" rx="112" stroke="url(#cyberBorder)" stroke-width="12"/>

  <!-- Subtle Cyber Reticle Accent Dots -->
  <circle cx="56" cy="56" r="6" fill="#faff69" opacity="0.6"/>
  <circle cx="456" cy="56" r="6" fill="#faff69" opacity="0.6"/>
  <circle cx="56" cy="456" r="6" fill="#faff69" opacity="0.6"/>
  <circle cx="456" cy="456" r="6" fill="#faff69" opacity="0.6"/>

  <!-- The "A" Apex & Left/Right Wings (AIWAY Monogram) -->
  <g filter="url(#neonBlur)">
    <!-- Outer "A" Stems -->
    <path d="M256 96 L130 404 H195 L225 328 H287 L317 404 H382 L256 96 Z M256 220 L273 274 H239 L256 220 Z" fill="url(#neonYellow)"/>
    
    <!-- Central Modern Cyber Chevron / "W" Path Motif -->
    <path d="M256 274 L298 382 L340 274 H366 L312 414 H284 L256 342 L228 414 H200 L146 274 H172 L214 382 L256 274 Z" fill="url(#accentGlow)"/>
  </g>

  <!-- High-Energy Core AI Spark -->
  <circle cx="256" cy="180" r="14" fill="#ffffff" filter="url(#neonBlur)"/>
  <circle cx="256" cy="180" r="7" fill="#faff69"/>
</svg>
